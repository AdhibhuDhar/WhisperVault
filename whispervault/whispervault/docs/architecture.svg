<svg viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A4A4A"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1B5E8C"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#FAFAF8"/>

  <!-- Title -->
  <text x="700" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1A1A1A">WhisperVault — Air-Gapped PII Redaction Engine</text>
  <text x="700" y="72" text-anchor="middle" font-size="15" fill="#666666">Architecture: Dual-Pipeline, Hybrid Redaction, Human-in-the-Loop</text>

  <!-- Legend -->
  <rect x="1060" y="94" width="14" height="14" fill="#D9EDF7" stroke="#1B5E8C" stroke-width="1"/>
  <text x="1080" y="105" font-size="12" fill="#333333">Hexagon NPU (INT8/FP16)</text>
  <rect x="1060" y="114" width="14" height="14" fill="#FFF2CC" stroke="#B08900" stroke-width="1"/>
  <text x="1080" y="125" font-size="12" fill="#333333">CPU (lightweight, non-ML)</text>
  <rect x="1060" y="134" width="14" height="14" fill="#E6E6E6" stroke="#4A4A4A" stroke-width="1"/>
  <text x="1080" y="145" font-size="12" fill="#333333">Local storage / output</text>

  <!-- INPUT -->
  <rect x="40" y="150" width="200" height="70" rx="8" fill="#E6E6E6" stroke="#4A4A4A" stroke-width="1.5"/>
  <text x="140" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A">Input Audio File</text>
  <text x="140" y="196" text-anchor="middle" font-size="11" fill="#555555">.wav / .mp3, local disk</text>
  <text x="140" y="210" text-anchor="middle" font-size="10" fill="#888888">No network call, ever</text>

  <!-- NPU BOUNDARY BOX (Stage 1) -->
  <rect x="300" y="110" width="1060" height="220" rx="10" fill="none" stroke="#1B5E8C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="316" y="132" font-size="13" font-weight="700" fill="#1B5E8C">HEXAGON NPU — STAGE 1 · SPEECH-TO-TEXT (STATIC GRAPH)</text>

  <!-- Chunker -->
  <rect x="320" y="150" width="190" height="90" rx="8" fill="#D9EDF7" stroke="#1B5E8C" stroke-width="1.5"/>
  <text x="415" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#0F3A57">Audio Chunker</text>
  <text x="415" y="192" text-anchor="middle" font-size="11" fill="#26597D">30s fixed windows</text>
  <text x="415" y="207" text-anchor="middle" font-size="11" fill="#26597D">+5s overlap stride</text>
  <text x="415" y="222" text-anchor="middle" font-size="10" fill="#4A80A0">(Fix #2: boundary safety)</text>

  <!-- Whisper -->
  <rect x="550" y="150" width="220" height="90" rx="8" fill="#D9EDF7" stroke="#1B5E8C" stroke-width="1.5"/>
  <text x="660" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#0F3A57">Whisper-Base (INT8)</text>
  <text x="660" y="192" text-anchor="middle" font-size="11" fill="#26597D">AI Hub-validated model</text>
  <text x="660" y="207" text-anchor="middle" font-size="11" fill="#26597D">bounded autoregressive decode</text>
  <text x="660" y="222" text-anchor="middle" font-size="10" fill="#4A80A0">~5-7ms/decode step (NPU-profiled)</text>

  <!-- Stitcher -->
  <rect x="810" y="150" width="220" height="90" rx="8" fill="#D9EDF7" stroke="#1B5E8C" stroke-width="1.5"/>
  <text x="920" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#0F3A57">Transcript Stitcher</text>
  <text x="920" y="192" text-anchor="middle" font-size="11" fill="#26597D">De-dupes overlap regions</text>
  <text x="920" y="207" text-anchor="middle" font-size="11" fill="#26597D">merges split words/names</text>
  <text x="920" y="222" text-anchor="middle" font-size="10" fill="#4A80A0">CPU-side glue, negligible cost</text>

  <!-- Whisper stage note -->
  <text x="1200" y="196" text-anchor="middle" font-size="11" fill="#1B5E8C" font-weight="600">Runs</text>
  <text x="1200" y="212" text-anchor="middle" font-size="11" fill="#1B5E8C" font-weight="600">sequentially,</text>
  <text x="1200" y="228" text-anchor="middle" font-size="11" fill="#1B5E8C" font-weight="600">chunk by chunk</text>

  <!-- arrows stage 1 -->
  <line x1="240" y1="185" x2="318" y2="195" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="195" x2="548" y2="195" stroke="#1B5E8C" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="770" y1="195" x2="808" y2="195" stroke="#1B5E8C" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Plain transcript output -->
  <rect x="580" y="270" width="180" height="46" rx="6" fill="#FFFFFF" stroke="#888888" stroke-width="1.2"/>
  <text x="670" y="298" text-anchor="middle" font-size="12" fill="#333333">Raw Transcript (.txt)</text>
  <line x1="920" y1="240" x2="670" y2="270" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- NPU BOUNDARY BOX (Stage 2) -->
  <rect x="80" y="380" width="1240" height="260" rx="10" fill="none" stroke="#1B5E8C" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="96" y="402" font-size="13" font-weight="700" fill="#1B5E8C">STAGE 2 · HYBRID REDACTION ENGINE (PARALLEL, NOT NER-ONLY — FIX #3)</text>

  <line x1="670" y1="316" x2="670" y2="380" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="380" x2="670" y2="400" stroke="#4A4A4A" stroke-width="0"/>

  <!-- 512-token chunker -->
  <rect x="580" y="412" width="180" height="50" rx="6" fill="#FFF2CC" stroke="#B08900" stroke-width="1.2"/>
  <text x="670" y="433" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5C4600">Token Chunker</text>
  <text x="670" y="450" text-anchor="middle" font-size="10.5" fill="#7A6100">512-token windows + overlap stride</text>

  <line x1="670" y1="462" x2="670" y2="490" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Three parallel detectors -->
  <rect x="120" y="500" width="280" height="110" rx="8" fill="#D9EDF7" stroke="#1B5E8C" stroke-width="1.5"/>
  <text x="260" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#0F3A57">NER Model (INT8)</text>
  <text x="260" y="542" text-anchor="middle" font-size="11" fill="#26597D">DistilBERT, HF-sourced,</text>
  <text x="260" y="557" text-anchor="middle" font-size="11" fill="#26597D">compiled via AI Hub toolchain</text>
  <text x="260" y="575" text-anchor="middle" font-size="11" fill="#26597D">catches: PERSON, ORG, LOCATION</text>
  <text x="260" y="595" text-anchor="middle" font-size="10" fill="#4A80A0">(semantic entities)</text>

  <rect x="440" y="500" width="280" height="110" rx="8" fill="#FFF2CC" stroke="#B08900" stroke-width="1.5"/>
  <text x="580" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#5C4600">Regex / Pattern Matcher</text>
  <text x="580" y="542" text-anchor="middle" font-size="11" fill="#7A6100">CPU, deterministic</text>
  <text x="580" y="557" text-anchor="middle" font-size="11" fill="#7A6100">catches: SSN, MRN, phone,</text>
  <text x="580" y="572" text-anchor="middle" font-size="11" fill="#7A6100">card/account numbers, dosages</text>
  <text x="580" y="592" text-anchor="middle" font-size="10" fill="#8A7000">(structured patterns)</text>

  <rect x="760" y="500" width="280" height="110" rx="8" fill="#FFF2CC" stroke="#B08900" stroke-width="1.5"/>
  <text x="900" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#5C4600">Custom Keyword Dictionary</text>
  <text x="900" y="542" text-anchor="middle" font-size="11" fill="#7A6100">User-supplied, CPU lookup</text>
  <text x="900" y="557" text-anchor="middle" font-size="11" fill="#7A6100">catches: internal codenames,</text>
  <text x="900" y="572" text-anchor="middle" font-size="11" fill="#7A6100">org-specific terms</text>
  <text x="900" y="592" text-anchor="middle" font-size="10" fill="#8A7000">(bring-your-own list)</text>

  <!-- fan out arrows -->
  <line x1="670" y1="462" x2="260" y2="498" stroke="#4A4A4A" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="670" y1="462" x2="580" y2="498" stroke="#4A4A4A" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="670" y1="462" x2="900" y2="498" stroke="#4A4A4A" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- merge -->
  <rect x="480" y="635" width="360" height="0" fill="none"/>
  <line x1="260" y1="610" x2="660" y2="665" stroke="#4A4A4A" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="580" y1="610" x2="660" y2="665" stroke="#4A4A4A" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="900" y1="610" x2="660" y2="665" stroke="#4A4A4A" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Merge + confidence gate -->
  <rect x="510" y="668" width="320" height="52" rx="6" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.3"/>
  <text x="670" y="689" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Merge Flagged Spans + Confidence Gate</text>
  <text x="670" y="705" text-anchor="middle" font-size="10.5" fill="#666666">(threshold-tunable, reduces false-positive noise)</text>

  <line x1="670" y1="720" x2="670" y2="748" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pseudonymization Engine -->
  <rect x="430" y="750" width="480" height="70" rx="8" fill="#FFF2CC" stroke="#B08900" stroke-width="1.6"/>
  <text x="670" y="775" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5C4600">Pseudonymization Engine (CPU)</text>
  <text x="670" y="793" text-anchor="middle" font-size="11" fill="#7A6100">Consistent tagging: "John Smith" → [PERSON_001] everywhere · Fix #7</text>
  <text x="670" y="808" text-anchor="middle" font-size="10" fill="#8A7000">reversible, not destructive [REDACTED] replacement</text>

  <line x1="530" y1="820" x2="300" y2="860" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="810" y1="820" x2="1040" y2="860" stroke="#4A4A4A" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Two outputs -->
  <rect x="140" y="862" width="320" height="90" rx="8" fill="#E6E6E6" stroke="#4A4A4A" stroke-width="1.5"/>
  <text x="300" y="886" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Pseudonymized Output</text>
  <text x="300" y="904" text-anchor="middle" font-size="11" fill="#555555">.docx / .txt — safe to share,</text>
  <text x="300" y="919" text-anchor="middle" font-size="11" fill="#555555">upload to internal DB, or feed local RAG</text>
  <text x="300" y="936" text-anchor="middle" font-size="10" fill="#888888">no re-identifiable PII present</text>

  <rect x="880" y="862" width="320" height="90" rx="8" fill="#E6E6E6" stroke="#4A4A4A" stroke-width="1.5"/>
  <text x="1040" y="886" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Encrypted Mapping Vault</text>
  <text x="1040" y="904" text-anchor="middle" font-size="11" fill="#555555">DPAPI-protected, local-only · Fix #7 + #11</text>
  <text x="1040" y="919" text-anchor="middle" font-size="11" fill="#555555">unlocks re-identification for the</text>
  <text x="1040" y="936" text-anchor="middle" font-size="10" fill="#888888">original professional only</text>

  <!-- Human review side note -->
  <rect x="1120" y="380" width="200" height="260" rx="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="1220" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">Human-in-the-Loop</text>
  <text x="1220" y="424" text-anchor="middle" font-size="10.5" fill="#555555">Side-by-side diff view</text>
  <text x="1220" y="440" text-anchor="middle" font-size="10.5" fill="#555555">Accept / reject each</text>
  <text x="1220" y="454" text-anchor="middle" font-size="10.5" fill="#555555">flagged span before</text>
  <text x="1220" y="468" text-anchor="middle" font-size="10.5" fill="#555555">final output is written</text>
  <text x="1220" y="500" text-anchor="middle" font-size="10" fill="#888888" font-style="italic">Decision support,</text>
  <text x="1220" y="514" text-anchor="middle" font-size="10" fill="#888888" font-style="italic">not an autonomous</text>
  <text x="1220" y="528" text-anchor="middle" font-size="10" fill="#888888" font-style="italic">compliance guarantee</text>
  <text x="1220" y="548" text-anchor="middle" font-size="10" fill="#888888" font-style="italic">— Fix #8</text>
  <line x1="1120" y1="560" x2="1030" y2="560" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Footer -->
  <text x="700" y="972" text-anchor="middle" font-size="11" fill="#999999">100% on-device · Snapdragon X Elite / X Plus (Hexagon NPU) · Zero network egress at any pipeline stage</text>
</svg>
